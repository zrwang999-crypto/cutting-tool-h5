const key='project-dashboard-h5-v1';const schedule={'P-180 GrandJar':{deadline:'2026-10-25'},'D-181 Ultra Slim':{deadline:'2026-10-20'},'D-183 Ultra Stick':{deadline:'待肖经理报告',nextOwner:'肖经理'},'D-189 Nano X':{deadline:'2026-10-19'},'P-196 PodPacker':{deadline:'2026-10-20'},'P-179 Chorus Bubbler':{deadline:'待客户确认'},'D-172 Key Fob 保时捷钥匙':{deadline:'待Link输出3D/渲染图',nextOwner:'Link'},'G-185 烧花烟斗':{deadline:'2026-10-12'},'多功能切膏刀':{deadline:'2026-10-14',nextOwner:'黄亮'},'切膏刀圆杆':{start:'2026-10-15',nextOwner:'待确认'},'点烟器圆杆':{start:'2026-10-15',nextOwner:'待确认'}};let data=JSON.parse(localStorage.getItem(key)||'null')||seed.map(x=>({name:x[0],priority:x[1],stage:x[2],progress:x[3],node:x[4],note:x[5],owner:x[6],next:x[7]}));data=data.map(p=>({...p,start:p.start??schedule[p.name]?.start??'',deadline:p.deadline??schedule[p.name]?.deadline??'',nextOwner:p.nextOwner??schedule[p.name]?.nextOwner??p.owner??'待确认'}));let active='全部';const stages=['全部','已完成/量产','进行中','核价/估价','堆叠图输出中','预研/待确认'];
function status(p){if(p.stage==='MP'||p.progress===100)return'已完成/量产';if(p.stage==='堆叠图输出中')return'堆叠图输出中';if(p.stage==='核价阶段'||p.note.includes('估价'))return'核价/估价';if(p.stage==='预研'||p.progress==null)return'预研/待确认';return'进行中'}function icon(p){const s=status(p);return s==='已完成/量产'?'✓':s==='堆叠图输出中'?'◌':s==='核价/估价'?'￥':s==='预研/待确认'?'◇':'↗'}function save(){localStorage.setItem(key,JSON.stringify(data));render()}function matches(p){const q=document.getElementById('search').value.trim().toLowerCase();return(active==='全部'||status(p)===active)&&(!q||[p.name,p.owner,p.note,p.next,p.stage].join(' ').toLowerCase().includes(q))}
function renderSummary(){const known=data.filter(p=>typeof p.progress==='number');const avg=known.length?Math.round(known.reduce((a,p)=>a+p.progress,0)/known.length):0;const counts=[data.length,avg+'%',data.filter(p=>status(p)==='已完成/量产').length,data.filter(p=>status(p)==='进行中').length,data.filter(p=>status(p)==='堆叠图输出中'||status(p)==='核价/估价').length];document.getElementById('summary').innerHTML=[['全部项目',counts[0],'个'],['当前平均进度',counts[1],''],['已完成/量产',counts[2],'个'],['推进中',counts[3],'个'],['待对齐节点',counts[4],'个']].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="num">${x[1]} <small>${x[2]}</small></div></div>`).join('')}
function renderChips(){document.getElementById('chips').innerHTML=stages.map(s=>`<button class="chip ${active===s?'active':''}" onclick="active='${s}';render()">${s}</button>`).join('')}
function renderCards(){const focus=['切膏刀圆杆','点烟器圆杆','多功能切膏刀','Herb Cigar 烧花雪茄','G-185 烧花烟斗','D-183 Ultra Stick','D-172 Key Fob 保时捷钥匙'];document.getElementById('cards').innerHTML=data.filter(p=>focus.includes(p.name)).map(p=>{const val=p.progress==null?0:p.progress,s=status(p);return`<article class="card"><div class="card-top"><div style="display:flex;gap:10px"><div class="icon">${icon(p)}</div><div><h3>${p.name}</h3><div class="stage">${p.stage||'阶段待确认'}</div></div></div><span class="badge ${s==='已完成/量产'?'done':s.includes('堆叠')||s.includes('核价')?'warn':s.includes('预研')?'pending':''}">${s}</span></div><div class="progress-row"><span>当前进度</span><b>${p.progress==null?'待更新':p.progress+'%'}</b></div><div class="progress"><i style="width:${val}%"></i></div><div class="card-details"><div>当前进展：<b>${p.note||'待补充'}</b></div><div>下一步：<b>${p.next||'待补充'}</b></div><div>下一步负责人：<b>${p.nextOwner||'待确认'}</b></div><div>节点时间：<b>${p.start||'待确认'} → ${p.deadline||'待确认'}</b></div></div></article>`}).join('')}
function autoGrow(el){el.style.height='auto';el.style.height=Math.max(76,el.scrollHeight)+'px'}function upgradeLongFields(){document.querySelectorAll('#table tr').forEach(tr=>{const name=tr.querySelector('b')?.textContent;const idx=data.findIndex(p=>p.name===name);[7,8].forEach((col,n)=>{const old=tr.cells[col]?.querySelector('input');if(!old||idx<0)return;const t=document.createElement('textarea');t.className='long-edit';t.rows=3;t.value=old.value;t.oninput=()=>autoGrow(t);t.onchange=()=>update(idx,n?'next':'note',t.value);old.replaceWith(t);autoGrow(t)})})}function update(i,field,value){data[i][field]=field==='progress'?(value===''?null:Number(value)):value;save()}function renderTable(){const rows=data.map((p,i)=>({p,i})).filter(x=>matches(x.p));document.getElementById('count').textContent=`显示 ${rows.length} / ${data.length} 个项目`;document.getElementById('table').innerHTML=rows.length?rows.map(({p,i})=>`<tr><td><div class="project-cell"><div class="mini-icon">${icon(p)}</div><div><b>${p.name}</b><div style="color:var(--muted);font-size:11px">${p.stage||'阶段待确认'}</div></div></div></td><td><select onchange="update(${i},'priority',this.value)"><option ${p.priority==='S+'?'selected':''}>S+</option><option ${p.priority==='S'?'selected':''}>S</option><option ${p.priority==='A'?'selected':''}>A</option><option ${p.priority==='待设定'?'selected':''}>待设定</option></select></td><td><select onchange="update(${i},'stage',this.value)">${['MP','PVT','DVT','EVT','预研','核价阶段','堆叠图输出中','阶段待确认'].map(s=>`<option ${p.stage===s?'selected':''}>${s}</option>`).join('')}</select></td><td><input class="range" type="range" min="0" max="100" value="${p.progress==null?0:p.progress}" oninput="this.nextElementSibling.textContent=this.value+'%';update(${i},'progress',this.value)"><span class="pct">${p.progress==null?'待更新':p.progress+'%'}</span></td><td><input type="text" value="${p.start||''}" placeholder="待确认" onchange="update(${i},'start',this.value)"></td><td><input type="text" value="${p.deadline| function upgradeLongFields(){document.querySelectorAll('#table tr').forEach(tr=>{const name=tr.querySelector('b')?.textContent;const idx=data.findIndex(p=>p.name===name);const fields=['','','','','start','deadline','node','note','next','nextOwner','owner'];[4,5,6,7,8,9,10].forEach(col=>{const old=tr.cells[col]?.querySelector('input');if(!old||idx<0)return;const t=document.createElement('textarea');t.className=col===7||col===8?'long-edit':'cell-edit';t.rows=col===7||col===8?3:2;t.value=old.value;t.oninput=()=>autoGrow(t);t.onchange=()=>update(idx,fields[col],t.value);old.replaceWith(t);autoGrow(t)})})}
upgradeLongFields();
</script><script>
function update(i,field,value){if(field==='progress'){const v=String(value).trim();if(v===''){data[i].progress=null}else if(/^\d+(\.\d+)?%?$/.test(v)){data[i].progress=Number(v.replace('%',''))}else{data[i].progress=v}}else{data[i][field]=value}save()}
function upgradeLongFields(){document.querySelectorAll('#table tr').forEach(tr=>{const name=tr.querySelector('b')?.textContent;const idx=data.findIndex(p=>p.name===name);const fields=['','','','progress','start','deadline','node','note','next','nextOwner','owner'];[3,4,5,6,7,8,9,10].forEach(col=>{const old=tr.cells[col]?.querySelector('input');if(!old||idx<0)return;const t=document.createElement('textarea');t.className=col===7||col===8?'long-edit':'cell-edit';t.rows=col===7||col===8?3:2;t.value=old.value;t.oninput=()=>autoGrow(t);t.onchange=()=>update(idx,fields[col],t.value);old.replaceWith(t);autoGrow(t)})})}
function renderCards(){const focus=['切膏刀圆杆','点烟器圆杆','多功能切膏刀','Herb Cigar 烧花雪茄','G-185 烧花烟斗','D-183 Ultra Stick','D-172 Key Fob 保时捷钥匙'];document.getElementById('cards').innerHTML=data.filter(p=>focus.includes(p.name)).map(p=>{const val=typeof p.progress==='number'?p.progress:0,s=status(p),display=p.progress==null?'待更新':typeof p.progress==='number'?p.progress+'%':p.progress;return`<article class="card"><div class="card-top"><div style="display:flex;gap:10px"><div class="icon">${icon(p)}</div><div><h3>${p.name}</h3><div class="stage">${p.stage||'阶段待确认'}</div></div></div><span class="badge ${s==='已完成/量产'?'done':s.includes('堆叠')||s.includes('核价')?'warn':s.includes('预研')?'pending':''}">${s}</span></div><div class="progress-row"><span>当前进度</span><b>${display}</b></div><div class="progress"><i style="width:${val}%"></i></div><div class="card-details"><div>当前进展：<b>${p.note||'待补充'}</b></div><div>下一步：<b>${p.next||'待补充'}</b></div><div>下一步负责人：<b>${p.nextOwner||'待确认'}</b></div><div>节点时间：<b>${p.start||'待确认'} → ${p.deadline||'待确认'}</b></div></div></article>`}).join('')}
function update(i,field,value){data[i][field]=String(value);save()}
function renderSummary(){const filled=data.filter(p=>String(p.progress??'').trim()!=='').length;const counts=[data.length,filled,data.filter(p=>status(p)==='已完成/量产').length,data.filter(p=>status(p)==='进行中').length,data.filter(p=>status(p)==='堆叠图输出中'||status(p)==='核价/估价').length];document.getElementById('summary').innerHTML=[['全部项目',counts[0],'个'],['已填写当前进度',counts[1],'个'],['已完成/量产',counts[2],'个'],['推进中',counts[3],'个'],['待对齐节点',counts[4],'个']].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="num">${x[1]} <small>${x[2]}</small></div></div>`).join('')}
data=data.map(p=>({...p,progress:typeof p.progress==='number'?String(p.progress):p.progress}));upgradeLongFields();renderSummary();renderCards();
</script><script>
const sharedSheetCsv='https://docs.google.com/spreadsheets/d/1xjRVCFXwPU-O-DEZYtbPh3afyhnZnrtIDSS1t7XFy64/gviz/tq?tqx=out:csv&gid=1661635797';
function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(quoted){if(ch==='"'&&next==='"'){cell+='"';i++}else if(ch==='"'){quoted=false}else cell+=ch}else if(ch==='"'){quoted=true}else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=ch}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}
async function loadSharedData(){try{const response=await fetch(sharedSheetCsv,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const rows=parseCsv(await response.text()).slice(1).filter(r=>r[0]);data=rows.map(r=>({name:r[0]||'',priority:r[1]||'待设定',stage:r[2]||'阶段待确认',progress:r[3]===''?null:Number(String(r[3]).replace('%','')),node:'',note:r[6]||'',owner:r[8]||'',next:r[11]||'',start:'',deadline:r[7]||'',nextOwner:r[8]||''}));render();document.getElementById('sync-note').textContent='已同步共享表格 · 每30秒自动刷新'}catch(error){document.getElementById('sync-note').textContent='共享表格暂时无法读取，请点击上方链接填写'}}
loadSharedData();setInterval(loadSharedData,30000);
</script></body></html>
